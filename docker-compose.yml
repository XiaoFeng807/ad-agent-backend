services:
  web:
    build: .
    ports:
      - "127.0.0.1:5010:5010"
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      HF_HOME: /app/model-cache
    volumes:
      - storepilot-data:/app/data
      - storepilot-memory:/app/backend/memory/user_memory
      - storepilot-model-cache:/app/model-cache
    restart: unless-stopped

volumes:
  storepilot-data:
  storepilot-memory:
  storepilot-model-cache:
